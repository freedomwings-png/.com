            toast.className = `pointer-events-auto px-4 py-3 rounded-xl border ${bgClass} shadow-xl flex items-center gap-3 text-sm font-medium transition-all transform translate-y-2 opacity-0`;
            toast.innerHTML = `

                <span>${message}</span>
            `;
            container.appendChild(toast);
            lucide.createIcons();
            
            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

            });

            if (!dbState.currentUser) {

            openModal(`

        function submitTaskProof(e, taskId) {
            e.preventDefault();
            const link = document.getElementById('task-proof-link').value.trim();
            const lower = link.toLowerCase();

            if (!lower.includes('tiktok.com') && !lower.includes('facebook.com') && !lower.includes('fb.watch') && !lower.includes('youtube.com') && !lower.includes('youtu.be')) {
                showToast('Chỉ cho phép liên kết từ TIKTOK, FACEBOOK hoặc YOUTUBE!', 'error');
                return;
            }

            const task = dbState.tasks.find(t => t.id === taskId);
            
            // Mark as claimed for this user
            if (!dbState.userClaimedTasks[dbState.currentUser.username]) {
                dbState.userClaimedTasks[dbState.currentUser.username] = [];
            }
            dbState.userClaimedTasks[dbState.currentUser.username].push(taskId);

            // Send to admin task submissions inbox
            dbState.taskSubmissions.push({
                id: Date.now(),
                taskId,
                taskTitle: task ? task.title : 'Nhiệm vụ',
                points: task ? task.points : 0,
                username: dbState.currentUser.username,
                link,
                date: new Date().toLocaleString(),
                status: 'pending'
            });

            saveState();
            closeModal();
            showToast('Nộp báo cáo nhiệm vụ thành công! Chờ Admin duyệt để nhận điểm.');
            renderAll();
        }

        function submitEditReward(e, id) {

        function redeemReward(id) {
            if (!dbState.currentUser) {
                showToast('Vui lòng đăng nhập để đổi quà!', 'error');
                openLoginModal();
                return;
            }

            const rew = dbState.rewards.find(r => r.id === id);
            if (!rew) return;

            if (rew.qty <= 0) {
                showToast('KHÔNG ĐỦ SỐ LƯỢNG / HẾT LƯỢT ĐỔI QUÀ!', 'error');
                return;
            }

            if (dbState.currentUser.points < rew.points) {
                showToast('KHÔNG ĐỦ ĐIỂM ĐỂ ĐỔI QUÀ NÀY!', 'error');
                return;
            }

            // Deduct points
            dbState.currentUser.points -= rew.points;
            rew.qty -= 1;

            // Sync user in users list
            const userIdx = dbState.users.findIndex(u => u.username === dbState.currentUser.username);
            if (userIdx !== -1) {
                dbState.users[userIdx].points = dbState.currentUser.points;
            }

            // Send notification to member mailbox & admin mailbox
            const mailMsg = {
                id: Date.now(),
                recipient: dbState.currentUser.username,
                title: `Đổi quà thành công: ${rew.name}`,
                content: `Bạn đã đổi thành công phần quà "${rew.name}" với giá ${rew.points} điểm. BQT sẽ liên hệ trao thưởng sớm nhất!`,
                date: new Date().toLocaleString(),
                sender: 'Hệ thống Quà Tặng'
            };
            dbState.mailboxes.push(mailMsg);

            // Also admin notification
            dbState.mailboxes.push({
                id: Date.now() + 1,
                recipient: 'freedomwings2025',
                title: `Thành viên ${dbState.currentUser.username} vừa đổi quà`,
                content: `Thành viên ${dbState.currentUser.name} (${dbState.currentUser.username}) đã đổi phần quà "${rew.name}" (${rew.points} điểm).`,
                date: new Date().toLocaleString(),
                sender: 'Hệ thống'
            });

            saveState();
            showToast(`Đổi quà thành công! Đã trừ ${rew.points} điểm.`);
            renderAll();
        }

        function editAvatar() {
            const url = prompt('Nhập URL ảnh đại diện mới:', dbState.currentUser.avatar || '');
            if (url) {
                dbState.currentUser.avatar = url;
                // update in users list
                const idx = dbState.users.findIndex(u => u.username === dbState.currentUser.username);
                if (idx !== -1) dbState.users[idx].avatar = url;
                saveState();
                showToast('Đã đổi ảnh đại diện thành công!');
                renderAll();
            }
        }

        function updateProfile(e) {
            e.preventDefault();
            const name = document.getElementById('prof-name').value;
            const uid = document.getElementById('prof-uid').value;
            const bankName = document.getElementById('prof-bank-name').value;
            const bankAccount = document.getElementById('prof-bank-acc').value;

            dbState.currentUser.name = name;
            dbState.currentUser.uid = uid;
            dbState.currentUser.bankName = bankName;
            dbState.currentUser.bankAccount = bankAccount;

            const idx = dbState.users.findIndex(u => u.username === dbState.currentUser.username);
            if (idx !== -1) {
                dbState.users[idx] = { ...dbState.currentUser };
            }

            saveState();
            showToast('Cập nhật hồ sơ thành công!');
            renderAll();
        }


        // --- 7. HÒM THƯ ---

            if (!dbState.currentUser) {

                        <button onclick="openLoginModal()" class="px-6 py-2.5 bg-gaming-neon text-black font-bold rounded-xl">Đăng nhập ngay</button>

        // --- 8. QUẢN LÝ (ADMIN MANAGEMENT DASHBOARD) ---
        function renderAdminTab() {
            return `
                <div class="space-y-8">
                    <div class="bg-gaming-card border border-gaming-border p-6 rounded-2xl shadow-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <span class="px-3 py-1 bg-red-500/10 text-red-400 border border-red-500/30 text-xs font-black rounded-full uppercase">Khu vực kiểm soát tối cao</span>
                            <h2 class="text-2xl font-black text-white mt-2">BẢNG ĐIỀU KHIỂN ADMIN</h2>
                            <p class="text-xs text-zinc-400">Quản lý thành viên, duyệt đơn clan, báo cáo nhiệm vụ, đơn dịch vụ và gửi thư riêng.</p>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="switchAdminSubtab('members')" id="adm-btn-members" class="px-4 py-2 rounded-xl text-xs font-bold bg-gaming-neon text-black">Thành viên</button>
                            <button onclick="switchAdminSubtab('apps')" id="adm-btn-apps" class="px-4 py-2 rounded-xl text-xs font-bold bg-gaming-border text-white">Đơn Clan</button>
                            <button onclick="switchAdminSubtab('tasks')" id="adm-btn-tasks" class="px-4 py-2 rounded-xl text-xs font-bold bg-gaming-border text-white">Báo cáo Task</button>

                        </div>

                    <div id="admin-subtab-container">
                        <!-- Default rendered subtab -->
                        ${renderAdminMembersSubtab()}
                    </div>
                </div>
            `;
        }

        let adminSubtab = 'members';

        function switchAdminSubtab(sub) {
            adminSubtab = sub;
            ['members', 'apps', 'tasks', 'services', 'message'].forEach(s => {
                const btn = document.getElementById(`adm-btn-${s}`);
                if (btn) {
                    if (s === sub) {
                        btn.className = 'px-4 py-2 rounded-xl text-xs font-bold bg-gaming-neon text-black';
                    } else {
                        btn.className = 'px-4 py-2 rounded-xl text-xs font-bold bg-gaming-border text-white';
                    }
                }
            });

            const container = document.getElementById('admin-subtab-container');
            if (sub === 'members') container.innerHTML = renderAdminMembersSubtab();
            else if (sub === 'apps') container.innerHTML = renderAdminAppsSubtab();
            else if (sub === 'tasks') container.innerHTML = renderAdminTasksSubtab();
            else if (sub === 'services') container.innerHTML = renderAdminServicesSubtab();
            else if (sub === 'message') container.innerHTML = renderAdminMessageSubtab();
            lucide.createIcons();
        }

        // Subtab 1: Member Management
        function renderAdminMembersSubtab() {
            return `
                <div class="space-y-6">
                    <div class="flex gap-4 items-center">
                        <div class="relative flex-grow">
                            <i data-lucide="search" class="absolute left-3 top-3.5 w-4 h-4 text-zinc-400"></i>
                            <input type="text" id="adm-mem-search" oninput="filterAdminMembers()" placeholder="Tìm tên thành viên..." class="w-full bg-gaming-card border border-gaming-border rounded-xl pl-9 pr-4 py-2.5 text-sm text-white focus:border-gaming-neon outline-none">
                        </div>
                    </div>

                    <div class="bg-gaming-card border border-gaming-border rounded-2xl overflow-hidden shadow-xl">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse text-sm">
                                <thead>
                                    <tr class="border-b border-gaming-border text-zinc-400 text-xs bg-gaming-dark">
                                        <th class="p-4">Thành viên</th>
                                        <th class="p-4">UID Game</th>
                                        <th class="p-4">Gmail</th>
                                        <th class="p-4">Ngân hàng</th>
                                        <th class="p-4">Điểm</th>
                                        <th class="p-4">Role</th>
                                        <th class="p-4 text-right">Hành động</th>
                                    </tr>
                                </thead>
                                <tbody id="adm-member-tbody" class="divide-y divide-gaming-border">
                                    ${dbState.users.map(u => `
                                        <tr class="hover:bg-gaming-dark/50 transition-colors">
                                            <td class="p-4 flex items-center gap-3">
                                                <img src="${u.avatar || 'https://placehold.co/100'}" class="w-9 h-9 rounded-lg object-cover">
                                                <div>
                                                    <p class="font-bold text-white">${u.name || u.username}</p>
                                                    <p class="text-xs text-zinc-500">@${u.username}</p>
                                                </div>
                                            </td>
                                            <td class="p-4 text-zinc-300 font-mono text-xs">${u.uid || 'Chưa cập nhật'}</td>
                                            <td class="p-4 text-zinc-300 text-xs">${u.email}</td>
                                            <td class="p-4 text-xs text-zinc-300">
                                                ${u.bankName ? `${u.bankName} - ${u.bankAccount}` : '<span class="text-zinc-600">Chưa có</span>'}
                                            </td>
                                            <td class="p-4 text-gaming-neon font-extrabold">${u.points || 0}</td>
                                            <td class="p-4">
                                                <select onchange="adminChangeRole('${u.username}', this.value)" class="bg-gaming-dark border border-gaming-border text-xs rounded-lg px-2 py-1 text-white outline-none">
                                                    <option value="THÀNH VIÊN" ${u.role === 'THÀNH VIÊN' ? 'selected' : ''}>THÀNH VIÊN</option>
                                                    <option value="TUYỂN THỦ" ${u.role === 'TUYỂN THỦ' ? 'selected' : ''}>TUYỂN THỦ</option>
                                                    <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>admin</option>
                                                </select>
                                            </td>
                                            <td class="p-4 text-right space-x-2">
                                                <button onclick="adminKickUser('${u.username}')" class="px-2.5 py-1 bg-red-600/20 hover:bg-red-600 text-red-300 hover:text-white rounded-lg text-xs font-bold transition-colors">Kick / Xóa</button>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function filterAdminMembers() {
            const keyword = document.getElementById('adm-mem-search').value.toLowerCase();
            const rows = document.getElementById('adm-member-tbody').children;
            dbState.users.forEach((u, idx) => {
                const match = u.username.toLowerCase().includes(keyword) || (u.name && u.name.toLowerCase().includes(keyword));
                if (rows[idx]) rows[idx].style.display = match ? '' : 'none';
            });
        }

        function adminChangeRole(username, newRole) {
            const u = dbState.users.find(user => user.username === username);
            if (u) {
                u.role = newRole;
                saveState();
                showToast(`Đã đổi role của ${username} thành ${newRole}`);
                renderAll();
            }
        }

        function adminKickUser(username) {
            if (username === ADMIN_USER.username) {
                showToast('Không thể kick tài khoản Admin gốc!', 'error');
                return;
            }
            if (confirm(`Bạn có chắc chắn muốn xóa / kick thành viên ${username}?`)) {
                dbState.users = dbState.users.filter(u => u.username !== username);
                saveState();
                showToast('Đã xóa thành viên khỏi clan.');
                renderAll();
            }
        }

        // Subtab 2: Clan Registrations Inbox
        function renderAdminAppsSubtab() {
            return `
                <div class="space-y-4">
                    <h3 class="font-bold text-white text-base">Danh Sách Đơn Đăng Ký Clan & Tuyển Thủ</h3>
                    ${dbState.applications.length === 0 ? `
                        <div class="text-center py-12 bg-gaming-card border border-gaming-border rounded-2xl text-zinc-500">
                            Không có đơn đăng ký nào đang chờ duyệt.
                        </div>
                    ` : dbState.applications.map(app => `
                        <div class="bg-gaming-card border border-gaming-border rounded-2xl p-6 shadow-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                            <div class="space-y-2">
                                <div class="flex items-center gap-2">
                                    <span class="px-2.5 py-0.5 bg-emerald-500/20 text-gaming-neon text-xs font-bold rounded-full">${app.type}</span>
                                    <span class="text-xs text-zinc-400">${app.date}</span>
                                </div>
                                <h4 class="font-bold text-white text-base">${app.fullName} (@${app.username})</h4>
                                <p class="text-xs text-zinc-300">UID Game: <strong class="text-gaming-neon">${app.uidGame}</strong> | Gmail: ${app.email}</p>
                                ${app.phone ? `<p class="text-xs text-zinc-300">SĐT: ${app.phone} | Thiết bị: ${app.devices} | Chế độ: ${app.modes}</p>` : ''}

                                <button onclick="approveApp(${app.id})" class="px-4 py-2 bg-gaming-neon text-black font-extrabold text-xs rounded-xl hover:bg-emerald-400 shadow">Đồng ý</button>
                                <button onclick="rejectApp(${app.id})" class="px-4 py-2 bg-red-600 text-white font-extrabold text-xs rounded-xl hover:bg-red-500 shadow">Từ chối</button>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function approveApp(id) {
            const app = dbState.applications.find(a => a.id === id);
            if (!app) return;

            // Send notification to member mailbox
            dbState.mailboxes.push({
                id: Date.now(),
                recipient: app.username,
                title: `Đơn ${app.type} đã ĐƯỢC CHẤP NHẬN!`,
                content: `Chúc mừng bạn! Đơn đăng ký "${app.type}" của bạn đã được Quản trị viên phê duyệt. Chào mừng bạn gia nhập Freedom Wings.`,
                date: new Date().toLocaleString(),
                sender: 'BQT Clan'
            });

            // Remove application
            dbState.applications = dbState.applications.filter(a => a.id !== id);
            saveState();
            showToast('Đã chấp nhận đơn và gửi thư thông báo!');
            renderAll();
        }

        function rejectApp(id) {
            const app = dbState.applications.find(a => a.id === id);
            if (!app) return;

            dbState.mailboxes.push({
                id: Date.now(),
                recipient: app.username,
                title: `Đơn ${app.type} bị TỪ CHỐI`,
                content: `Rất tiếc, đơn đăng ký "${app.type}" của bạn chưa đạt yêu cầu hoặc chưa đổi đúng tên FW • name. Vui lòng kiểm tra lại.`,
                date: new Date().toLocaleString(),
                sender: 'BQT Clan'
            });

            dbState.applications = dbState.applications.filter(a => a.id !== id);
            saveState();
            showToast('Đã từ chối đơn.');
            renderAll();
        }

        // Subtab 3: Task Reports Inbox
        function renderAdminTasksSubtab() {
            return `

                            <div class="space-y-1">
                                <div class="flex items-center gap-2">

                                </div>

        function approveTaskSub(id) {
            const sub = dbState.taskSubmissions.find(s => s.id === id);
            if (!sub) return;

            // Add points to user
            const user = dbState.users.find(u => u.username === sub.username);
            if (user) {
                user.points = (user.points || 0) + sub.points;
            }

            // Send notification to member
            dbState.mailboxes.push({
                id: Date.now(),
                recipient: sub.username,
                title: `Báo cáo nhiệm vụ "${sub.taskTitle}" ĐÃ ĐƯỢC CHẤP NHẬN!`,
                content: `Tuyệt vời! Báo cáo nhiệm vụ của bạn đã được duyệt. Bạn nhận được +${sub.points} điểm thưởng vào tài khoản.`,
                date: new Date().toLocaleString(),
                sender: 'BQT Task'
            });

            dbState.taskSubmissions = dbState.taskSubmissions.filter(s => s.id !== id);
            saveState();
            showToast('Đã chấp nhận báo cáo và cộng điểm cho thành viên!');
            renderAll();
        }

        function rejectTaskSub(id) {
            const sub = dbState.taskSubmissions.find(s => s.id === id);
            if (!sub) return;

            dbState.mailboxes.push({
                id: Date.now(),
                recipient: sub.username,
                title: `Báo cáo nhiệm vụ "${sub.taskTitle}" bị từ chối`,
                content: `Rất tiếc, link minh chứng của bạn không hợp lệ hoặc chưa làm đúng yêu cầu nhiệm vụ.`,
                date: new Date().toLocaleString(),
                sender: 'BQT Task'
            });

            dbState.taskSubmissions = dbState.taskSubmissions.filter(s => s.id !== id);
            saveState();
            showToast('Đã từ chối báo cáo.');
            renderAll();
        }

        function openLoginModal() {
            openModal(`
                <h3 class="text-xl font-black text-white mb-2 text-center">ĐĂNG NHẬP HỆ THỐNG</h3>

                        </div>
                        <input type="password" id="login-pass" required class="w-full bg-gaming-dark border border-gaming-border rounded-xl px-4 py-3 text-white text-sm focus:border-gaming-neon outline-none" placeholder="Mật khẩu...">
                    </div>
                    <div class="flex justify-between items-center text-xs">

                        <button type="submit" class="w-full py-3 bg-gaming-neon hover:bg-emerald-400 text-black font-extrabold rounded-xl text-sm transition-colors shadow-lg">

                        </button>
                    </div>
                    <div class="text-center pt-2">
                        <p class="text-xs text-zinc-400">Chưa có tài khoản? <span onclick="openRegisterModal()" class="text-gaming-neon font-bold cursor-pointer hover:underline">Đăng ký ngay</span></p>
                    </div>
                </form>
            `);

        function togglePasswordVisibility(fieldId, btnEl) {
            const field = document.getElementById(fieldId);
            if (field.type === 'password') {
                field.type = 'text';
                btnEl.textContent = 'Ẩn';
            } else {
                field.type = 'password';
                btnEl.textContent = 'Hiện';
            }
        }

        function submitLogin(e) {
            e.preventDefault();
            const identifier = document.getElementById('login-user').value.trim();
            const pass = document.getElementById('login-pass').value.trim();

            const found = dbState.users.find(u => (u.username === identifier || u.email === identifier) && u.password === pass);
            if (found) {
                dbState.currentUser = found;
                saveState();
                closeModal();
                showToast(`Đăng nhập thành công! Chào mừng ${found.name || found.username}`);
                renderAll();
            } else {
                showToast('Tên đăng nhập hoặc mật khẩu không chính xác!', 'error');
            }
        }

        function openForgotModal() {
            openModal(`
                <h3 class="text-lg font-bold text-white mb-2">Khôi Phục Mật Khẩu</h3>
                <p class="text-xs text-zinc-400 mb-4">Nhập Gmail đã đăng ký để nhận gợi ý mật khẩu.</p>

                        <label class="block text-xs font-bold text-zinc-400 mb-1">Gmail đăng ký</label>

        function submitForgot(e) {
            e.preventDefault();
            const email = document.getElementById('forgot-email').value.trim();
            const user = dbState.users.find(u => u.email === email);
            if (user) {
                showToast(`Gợi ý mật khẩu cho tài khoản ${user.username}: Mật khẩu có độ dài ${user.password.length} ký tự (Bắt đầu bằng ${user.password[0]}...)`);
                openLoginModal();
            } else {
                showToast('Không tìm thấy tài khoản với Gmail này!', 'error');

        }

        function openRegisterModal() {
            openModal(`
                <h3 class="text-xl font-black text-white mb-2 text-center">ĐĂNG KÝ TÀI KHOẢN</h3>
                <p class="text-xs text-zinc-400 mb-6 text-center">Tạo tài khoản chính thức tham gia Freedom Wings</p>
                <form onsubmit="submitRegister(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-zinc-400 mb-1">Tên đăng nhập (Username)</label>

                        <input type="password" id="reg-pass" required minlength="8" class="w-full bg-gaming-dark border border-gaming-border rounded-xl px-4 py-2.5 text-white text-sm focus:border-gaming-neon outline-none" placeholder="Mật khẩu 8+ ký tự...">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-zinc-400 mb-1">Xác nhận mật khẩu</label>
                        <input type="password" id="reg-pass2" required minlength="8" class="w-full bg-gaming-dark border border-gaming-border rounded-xl px-4 py-2.5 text-white text-sm focus:border-gaming-neon outline-none" placeholder="Nhập lại mật khẩu...">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-zinc-400 mb-1">Gợi ý mật khẩu (Hint)</label>

                    <div class="text-center pt-1">
                        <p class="text-xs text-zinc-400">Đã có tài khoản? <span onclick="openLoginModal()" class="text-gaming-neon font-bold cursor-pointer hover:underline">Đăng nhập</span></p>
                    </div>
                </form>
            `);
        }

        function submitRegister(e) {
            e.preventDefault();
            const username = document.getElementById('reg-user').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const pass = document.getElementById('reg-pass').value;
            const pass2 = document.getElementById('reg-pass2').value;
            const hint = document.getElementById('reg-hint').value;

            if (dbState.users.some(u => u.username === username)) {
                showToast('Tên đăng nhập đã tồn tại! Vui lòng chọn tên khác.', 'error');
                return;
            }

            if (dbState.users.some(u => u.email === email)) {
                showToast('Gmail này đã được đăng ký tài khoản khác!', 'error');
                return;
            }

            if (!email.toLowerCase().endsWith('@gmail.com')) {
                showToast('Gmail bắt buộc phải là định dạng @gmail.com của Google!', 'error');
                return;
            }

            if (pass.length < 8) {
                showToast('Mật khẩu phải có ít nhất 8 ký tự!', 'error');
                return;
            }

            if (pass !== pass2) {
                showToast('Mật khẩu xác nhận không khớp!', 'error');
                return;
            }

            const newUser = {
                username,
                password: pass,
                role: 'THÀNH VIÊN',
                email,
                name: username,
                uid: 'FW-' + Math.floor(1000 + Math.random() * 9000),
                points: 0,
                avatar: 'https://placehold.co/150x150/10b981/09090b?text=' + username.substring(0,3).toUpperCase(),
                hint
            };

            dbState.users.push(newUser);
            dbState.currentUser = newUser;
            saveState();
            closeModal();
            showToast('Đăng ký tài khoản thành công!');
            renderAll();
        }

        function logout() {
            dbState.currentUser = null;
            saveState();
            showToast('Đã đăng xuất tài khoản.');
            switchTab('home');
        }

        // --- RUNTIME INITIALIZATION ---
        window.onload = function() {
            loadState();
            renderAll();
        };
    </script>
